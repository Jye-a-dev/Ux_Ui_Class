<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
</head>

<body bgcolor="#B0C4DE">

    <form action="#" name="dangnhap" method="post">

        <table border="1" cellspacing="0" width="350" align="center">

            <tr>
                <td colspan="2" align="center">
                    <b><font size="6">ĐĂNG NHẬP</font></b>
                </td>
            </tr>

            <tr>
                <td>Tên đăng nhập:</td>
                <td>
                    <input type="text" name="txtTenDangNhap">
                </td>
            </tr>

            <tr>
                <td>Mật khẩu:</td>
                <td>
                    <input type="password" name="txtMatKhau">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Đăng nhập">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
