<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành viên - Mockup</title>
    <link rel="stylesheet" type="text/css" href="../Style/style.css">
    <link rel="stylesheet" type="text/css" href="../Style/Dangky.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%); min-height: 100vh; padding: 40px 20px; display: flex; align-items: center; justify-content: center;">

    <div class="dangky-box" style="max-width: 650px; margin: 0 auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);">
        <h2 style="font-size: 20px; font-weight: 800; color: #1e3a8a; text-align: center; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.05em;">
            Đăng ký tài khoản mới
        </h2>
        <form action="#" name="dangky" method="post">
            <fieldset class="form-section">
                <legend>Thông tin cá nhân</legend>
                <table class="form-table">
                    <tr>
                        <td class="label-col">Họ và tên:</td>
                        <td class="input-col"><input type="text" name="txtHoTen" class="input-text" required placeholder="Nguyễn Văn A"></td>
                    </tr>
                    <tr>
                        <td class="label-col">Ngày sinh:</td>
                        <td class="input-col">
                            <select name="Ngay" class="select-dob">
                                <option value="01">01</option>
                                <option value="02">02</option>
                                <option value="03">03</option>
                                <option value="04">04</option>
                                <option value="05">05</option>
                            </select>
                            <span class="label-dob">Tháng</span>
                            <select name="Thang" class="select-dob">
                                <option value="01">01</option>
                                <option value="02">02</option>
                                <option value="03">03</option>
                                <option value="04">04</option>
                                <option value="05">05</option>
                            </select>
                            <span class="label-dob">Năm</span>
                            <input type="text" size="5" class="input-year" required placeholder="2000">
                        </td>
                    </tr>
                    <tr>
                        <td class="label-col">Giới tính:</td>
                        <td class="input-col">
                            <input type="radio" name="radGioiTinh" id="male" value="Nam" checked>
                            <label for="male" class="label-radio">Nam</label>
                            <input type="radio" name="radGioiTinh" id="female" value="Nữ">
                            <label for="female" class="label-radio">Nữ</label>
                        </td>
                    </tr>
                    <tr>
                        <td class="label-col">Địa chỉ:</td>
                        <td class="input-col"><textarea rows="3" class="input-textarea" required placeholder="Nhập địa chỉ của bạn..."></textarea></td>
                    </tr>
                    <tr>
                        <td class="label-col">Điện thoại:</td>
                        <td class="input-col"><input type="tel" name="txtDienThoai" class="input-text" required placeholder="0901234567"></td>
                    </tr>
                    <tr>
                        <td class="label-col">Email:</td>
                        <td class="input-col"><input type="email" name="txtEmail" required class="input-text" placeholder="example@domain.com"></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset class="form-section">
                <legend>Thông tin đăng nhập</legend>
                <table class="form-table">
                    <tr>
                        <td class="label-col">Tên đăng nhập:</td>
                        <td class="input-col"><input type="text" required class="input-text" placeholder="username123"></td>
                    </tr>
                    <tr>
                        <td class="label-col">Mật khẩu:</td>
                        <td class="input-col"><input type="password" required class="input-text" placeholder="••••••••"></td>
                    </tr>
                    <tr>
                        <td class="label-col">Nhập lại mật khẩu:</td>
                        <td class="input-col"><input type="password" required class="input-text" placeholder="••••••••"></td>
                    </tr>
                </table>
            </fieldset>

            <div class="form-buttons">
                <input type="submit" value="Đăng ký" class="btn-submit">
                <input type="reset" value="Hủy" class="btn-reset">
            </div>
        </form>
    </div>

</body>
</html>
