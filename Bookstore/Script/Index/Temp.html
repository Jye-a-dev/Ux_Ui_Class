<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<title>Đăng ký</title>
	</head>

	<body bgcolor="#B0C4DE">

		<form action="#" name="dangky" method="post">
			<table align="center" border="1" cellpadding="10" width="500">
				<tr>
					<td>
						<fieldset>
							<legend>
								<b>Thông tin cá nhân</b>
							</legend>

							<table>
								<tr>
									<td>Họ và tên:</td>
									<td>
										<input type="text" name="txtHoTen" />
									</td>
								</tr>

								<tr>
									<td>Ngày sinh:</td>
									<td>
										<select name="Ngay">
											<option value="01">01</option>
											<option value="02">02</option>
											<option value="03">03</option>
											<option value="04">04</option>
											<option value="05">05</option>
										</select>

										Tháng

										<select name="Thang">
											<option value="01">01</option>
											<option value="02">02</option>
											<option value="03">03</option>
											<option value="04">04</option>
											<option value="05">05</option>
										</select>

										Năm
										<input type="text" size="5" />
									</td>
								</tr>

								<tr>
									<td>Giới tính:</td>
									<td>
										<input type="radio" name="radGioiTinh" value="Nam" checked />
										Nam

										<input type="radio" name="radGioiTinh" value="Nữ" />
										Nữ
									</td>
								</tr>

								<tr>
									<td>Địa chỉ:</td>
									<td>
										<textarea rows="4" cols="30"></textarea>
									</td>
								</tr>

								<tr>
									<td>Điện thoại:</td>
									<td>
										<input type="tel" name="txtDienThoai" />
									</td>
								</tr>

								<tr>
									<td>Email:</td>
									<td>
										<input type="email" name="txtEmail" required />
									</td>
								</tr>
							</table>
						</fieldset>

						<br />

						<fieldset>
							<legend>
								<b>Thông tin đăng nhập</b>
							</legend>

							<table>
								<tr>
									<td>Tên đăng nhập:</td>
									<td>
										<input type="text" required />
									</td>
								</tr>

								<tr>
									<td>Mật khẩu:</td>
									<td>
										<input type="password" required />
									</td>
								</tr>

								<tr>
									<td>Nhập lại mật khẩu:</td>
									<td>
										<input type="password" required />
									</td>
								</tr>
							</table>
						</fieldset>

						<br />

						<div align="center">
							<input type="submit" value="Đăng ký" />
							<input type="reset" value="Hủy" />
						</div>
					</td>
				</tr>
			</table>
		</form>
	</body>
</html>
