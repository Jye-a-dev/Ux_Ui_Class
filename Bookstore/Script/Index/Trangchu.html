<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhà sách ABC</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(180deg, #b0c4de 0%, #dfe9f5 100%);
            color: #1f2937;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }
        .menu {
            text-align: center;
            background: #ffffffd8;
            border: 1px solid #d7e1ef;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(31, 41, 55, 0.06);
        }
        .menu a {
            color: #0b4f89;
            font-weight: 600;
            text-decoration: none;
            margin: 0 6px;
        }
        .menu a:hover { text-decoration: underline; }
        .card {
            background: #fff;
            border: 1px solid #d7e1ef;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(31, 41, 55, 0.06);
            padding: 10px;
            margin-bottom: 14px;
        }
        .embed {
            width: 100%;
            border: 0;
            border-radius: 8px;
            background: #f8fbff;
        }
        article.layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 14px;
        }
        footer {
            text-align: center;
            line-height: 1.6;
            font-size: 14px;
        }
        @media (max-width: 980px) {
            article.layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
