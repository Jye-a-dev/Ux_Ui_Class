<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
<!--Giúp trang web hiển thị đúng kích thước của màn hình, phóng to hay thu nhỏ là 1.0, giúp người dùng không cần phải zoom-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Responsive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background: #444;
        }
        nav a {
            color: #fff;
            padding: 15px 20px;
            text-decoration: none;
            transition: background 0.3s;
        }
        nav a:hover {
            background: #555;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 10px;
            padding: 20px;
            flex: 1 1 300px; /* Thuộc tính CSS được sử dụng để xác định cách mà một phần tử (flex item), nó sẽ co giãn chiếm không gian flex, responsive */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #333;
            color: #fff;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Trang chủ website</h1>
</header>

<nav>
    <a href="#home">Trang Chủ</a>
    <a href="#about">Giới Thiệu</a>
    <a href="#product">Sản phẩm</a>
    <a href="#services">Dịch Vụ</a>
    <a href="#contact">Liên Hệ</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Phần tử thẻ 1  </h2>
        <p>Nội dung cho hien thi 1</p>
    </div>
    <div class="card">
        <h2>Phần tử thẻ 2</h2>
        <p>Nội dung cho hien thi 2</p>
    </div>
    <div class="card">
        <h2>Phần tử thẻ 3</h2>
        <p>Nội dung cho hien thi 3</p>
    </div>
</div>

<footer>
    <p>&copy; Tác giả của website</p>
</footer>

</body>
</html>
